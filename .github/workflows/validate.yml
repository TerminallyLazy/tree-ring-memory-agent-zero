name: Validate plugin package

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Prepare isolated test environment
        run: |
          python3 -m venv .validation-venv
          .validation-venv/bin/pip install pytest==8.4.2 PyYAML==6.0.2
      - name: Validate hooks, bundles, provenance, and package contracts
        run: |
          .validation-venv/bin/python -m pytest -q -p no:cacheprovider \
            tests/test_manifest.py tests/test_release_bundle.py \
            tests/test_lifecycle_extensions.py tests/test_webui.py \
            tests/test_activation_package_layout.py
          node --check webui/memory-store.js
      - name: Validate runtime floor in an isolated Agent Zero package layout
        run: |
          mkdir -p "$RUNNER_TEMP/tree-ring-layout/usr/plugins"
          ln -s "$GITHUB_WORKSPACE" "$RUNNER_TEMP/tree-ring-layout/usr/plugins/tree_ring_memory"
          PYTHONPATH="$RUNNER_TEMP/tree-ring-layout" \
            .validation-venv/bin/python -m pytest -q -p no:cacheprovider \
              tests/test_cli.py tests/test_config_paths.py -k 'not real_'
      - name: Verify the bundled CLI through the bridge
        run: |
          PYTHONPATH="$RUNNER_TEMP/tree-ring-layout" \
          TREE_RING_MEMORY_CLI="$GITHUB_WORKSPACE/bin/linux-x86_64/tree-ring" \
            .validation-venv/bin/python -m pytest -q -p no:cacheprovider \
              tests/test_cli.py tests/test_activation.py -k real_
